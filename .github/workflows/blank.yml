# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'state/**'

permissions:
  contents: write

concurrency:
  group: my-app
  cancel-in-progress: false

jobs:
  run:
    if: github.actor != 'github-actions[bot]'

    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release     

      - name: Run the program
        id: run_program
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          try {
            $process = Start-Process -FilePath ".\MSFS2024Ukr\bin\Release\net8.0\MSFS2024Ukr.exe" -NoNewWindow -Wait -PassThru
          }
          catch {
            "should_continue=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($process.ExitCode -ne 0) {
            "should_continue=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "should_continue=true" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Refresh state
        if: steps.run_program.outputs.should_continue == 'true'
        run: cp -r .\MSFS2024Ukr\bin\Release\net8.0\state\app.json ..\\MSFS2024Ukr\MSFS2024Ukr\state\app.json
      
      - name: Refresh data directory recursively
        if: steps.run_program.outputs.should_continue == 'true'
        run: Copy-Item ".\MSFS2024Ukr\bin\Release\net8.0\data\*" "..\MSFS2024Ukr\MSFS2024Ukr\data\" -Recurse -Force
        shell: powershell

      - name: Zip MSFS2024ukr-en folder
        if: steps.run_program.outputs.should_continue == 'true'
        shell: pwsh
        run: |
          $source = ".\MSFS2024Ukr\bin\Release\net8.0\MSFS2024ukr-en\*"
          $zipFile = "MSFS2024ukr-en.zip"
          Compress-Archive -Path $source -DestinationPath $zipFile -Force

      - name: Zip MSFS2024ukr-ru folder
        if: steps.run_program.outputs.should_continue == 'true'
        shell: pwsh
        run: |
          $source = ".\MSFS2024Ukr\bin\Release\net8.0\MSFS2024ukr-ru\*"
          $zipFile = "MSFS2024ukr-ru.zip"
          Compress-Archive -Path $source -DestinationPath $zipFile -Force

      - name: Zip MSFS2024ukr-pl folder
        if: steps.run_program.outputs.should_continue == 'true'
        shell: pwsh
        run: |
          $source = ".\MSFS2024Ukr\bin\Release\net8.0\MSFS2024ukr-pl\*"
          $zipFile = "MSFS2024ukr-pl.zip"
          Compress-Archive -Path $source -DestinationPath $zipFile -Force


      - name: Build installer (silent)
        if: steps.run_program.outputs.should_continue == 'true'
        run: ISCC.exe "${{ github.workspace }}\installer\setup-en.iss"

      - name: Build installer (silent)
        if: steps.run_program.outputs.should_continue == 'true'
        run: ISCC.exe "${{ github.workspace }}\installer\setup-pl.iss"
        
      - name: Build installer (silent)
        if: steps.run_program.outputs.should_continue == 'true'
        run: ISCC.exe "${{ github.workspace }}\installer\setup-ru.iss"

      - name: Upload release asset en
        if: steps.run_program.outputs.should_continue == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "MSFS2024ukr-en.zip"
          tag_name: "zip"  # Можна використовувати будь-який тег, якщо потрібно
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset pl
        if: steps.run_program.outputs.should_continue == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "MSFS2024ukr-pl.zip"
          tag_name: "zip"  # Можна використовувати будь-який тег, якщо потрібно
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset ru
        if: steps.run_program.outputs.should_continue == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "MSFS2024ukr-ru.zip"
          tag_name: "zip"  # Можна використовувати будь-який тег, якщо потрібно
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer en
        if: steps.run_program.outputs.should_continue == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "D:\\a\\MSFS2024Ukr\\MSFS2024Ukr\\installer\\Output\\MSFS2024Ukr_en.exe"
          tag_name: "exe"  # Можна використовувати будь-який тег, якщо потрібно
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer pl
        if: steps.run_program.outputs.should_continue == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "D:\\a\\MSFS2024Ukr\\MSFS2024Ukr\\installer\\Output\\MSFS2024Ukr_pl.exe"
          tag_name: "exe"  # Можна використовувати будь-який тег, якщо потрібно
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer ru
        if: steps.run_program.outputs.should_continue == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "D:\\a\\MSFS2024Ukr\\MSFS2024Ukr\\installer\\Output\\MSFS2024Ukr_ru.exe"
          tag_name: "exe"  # Можна використовувати будь-який тег, якщо потрібно
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save state
        if: steps.run_program.outputs.should_continue == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add D:/a/MSFS2024Ukr/MSFS2024Ukr/MSFS2024Ukr/state/app.json
          git add D:/a/MSFS2024Ukr/MSFS2024Ukr/MSFS2024Ukr/data/
          git diff --cached --quiet || git commit -m "Update application state"

          git push
